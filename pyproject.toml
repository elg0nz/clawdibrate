[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawdibrate"
version = "0.14.0"
description = "Transcript-based AGENTS.md calibration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "elg0nz" }
]
dependencies = ["tiktoken"]

[project.scripts]
clawdibrate = "clawdibrate.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["clawdibrate*"]

[tool.setuptools.package-data]
clawdibrate = ["prompts/*.md", "skills/*/SKILL.md"]
